# Compila o programa ArchyOs para Windows (RustDesk 1.4.9 com a marca ArchyOs)
# e publica o instalador numa Release deste repositório. Passos copiados do CI
# oficial do RustDesk (flutter-build.yml / bridge.yml), sem assinatura.
name: Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["branding/**", ".github/workflows/windows.yml"]

permissions:
  contents: write

env:
  RUSTDESK_TAG: "1.4.9"
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  CARGO_EXPAND_VERSION: "1.0.95"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"

jobs:
  bridge:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.RUSTDESK_TAG }}
          submodules: recursive
          path: rustdesk

      - name: Dependências
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bridge
          workspaces: rustdesk

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Gerar ponte Flutter ↔ Rust
        working-directory: rustdesk
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          (cd flutter && flutter pub get)
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - uses: actions/upload-artifact@v4
        with:
          name: bridge
          path: |
            rustdesk/src/bridge_generated.rs
            rustdesk/src/bridge_generated.io.rs
            rustdesk/flutter/lib/generated_bridge.dart
            rustdesk/flutter/lib/generated_bridge.freezed.dart
            rustdesk/flutter/macos/Runner/bridge_generated.h
            rustdesk/flutter/ios/Runner/bridge_generated.h

  windows:
    needs: bridge
    runs-on: windows-2022
    env:
      VCPKG_BINARY_SOURCES: "clear;files,C:\\vcpkg-cache,readwrite"
    defaults:
      run:
        working-directory: rustdesk
    steps:
      - uses: actions/checkout@v4
        with:
          path: archyos

      - uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.RUSTDESK_TAG }}
          submodules: recursive
          path: rustdesk

      - uses: actions/download-artifact@v4
        with:
          name: bridge
          path: rustdesk

      - name: Aplicar a marca ArchyOs
        run: |
          pip install pillow
          python ..\archyos\branding\apply.py

      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      # Mesma versão do CI oficial (as mais novas instalam em outra pasta).
      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685 (motor Flutter ajustado pelo RustDesk)
      - name: Motor Flutter do RustDesk
        run: |
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $root = Split-Path (Split-Path (Get-Command flutter).Source)
          Write-Host "Flutter em $root"
          mv -Force windows-x64-release/* "$root/bin/cache/artifacts/engine/windows-x64-release/"

      - name: Ajuste do Flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows
          workspaces: rustdesk

      - name: Cache das dependências (vcpkg)
        uses: actions/cache@v4
        with:
          path: C:\vcpkg-cache
          key: vcpkg-x64-windows-static-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('rustdesk/vcpkg.json') }}
          restore-keys: vcpkg-x64-windows-static-${{ env.VCPKG_COMMIT_ID }}-

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: true

      - name: Dependências (vcpkg)
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          mkdir -p /c/vcpkg-cache
          set +e
          $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed" > ../vcpkg.log 2>&1
          rc=$?
          tail -n 30 ../vcpkg.log
          if [ $rc -ne 0 ]; then
            for f in $(find "$VCPKG_ROOT/buildtrees" -name "*-err.log" -size +0 | head -3); do echo "::error title=$f::$(tail -n 25 "$f" | sed ':a;N;$!ba;s/\n/%0A/g')"; done
            echo "::error title=vcpkg::$(tail -n 40 ../vcpkg.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit $rc
          fi

      - name: Compilar
        shell: bash
        run: |
          set +e
          python3 ./build.py --portable --flutter --skip-portable-pack --hwcodec --vram > ../build.log 2>&1
          rc=$?
          tail -n 40 ../build.log
          if [ $rc -ne 0 ]; then
            grep -n "error" ../build.log | tail -n 15 | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/^/::error title=erros::/'
            echo "::error title=fim do log::$(tail -n 40 ../build.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit $rc
          fi
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

      - name: Recursos do .exe (Runner.res)
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res" | head -1)
          [ -n "$runner_res" ] && cp "$runner_res" ./libs/portable/Runner.res

      - name: Montar o instalador
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ../out
          mv ./target/release/rustdesk-portable-packer.exe ../out/ArchyOs-motor-${{ env.RUSTDESK_TAG }}-x64.exe
          ls -la ../out

      - uses: actions/upload-artifact@v4
        with:
          name: archyos-windows
          path: out

      - name: Publicar na Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: motor-${{ env.RUSTDESK_TAG }}
          name: ArchyOs (motor ${{ env.RUSTDESK_TAG }})
          files: out/ArchyOs-motor-*.exe
          make_latest: true
